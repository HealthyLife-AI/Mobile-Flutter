# Localization generation settings. `flutter pub get` (generate: true in
# pubspec.yaml) and `flutter gen-l10n` regenerate lib/l10n/generated/ from the
# ARB files. Edit the ARB files, never the generated Dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n/generated
nullable-getter: false
