name: healthylife_ai
description: HealthyLife AI - Design & Motion System (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  device_preview: ^1.3.1
  # State management (Cubits/Blocs) — see lib/presentation/bloc.
  flutter_bloc: ^9.1.1
  # HTTP transport for ApiClient (lib/core/network). The app currently runs
  # on mock data sources; this is the ready-to-wire real transport.
  http: ^1.2.2
  # Local storage (session, settings, cached entries) behind the
  # StorageService abstraction in lib/core/storage.
  shared_preferences: ^2.3.0
  # Date/number formatting used by flutter gen-l10n and formatters.
  intl: any
  firebase_core: ^3.0.0      # أو أحدث إصدار متوافق
  firebase_messaging: ^15.0.0 # لإدارة الإشعارات (Push Notifications) المطلوبة في التطبيق
  # Opens the OS app-settings page ("Open notification settings") from the
  # notification settings screen. Notification permission itself is read and
  # requested through firebase_messaging (already configured); this package is
  # used only for `openAppSettings()`.
  permission_handler: ^12.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  # Medical report upload (spec phase 4): camera and gallery, resized to
  # ~2000 px at 80% JPEG quality before upload (iPhone HEIC included).
  image_picker: ^1.2.4
  # Picking a PDF report from the device files.
  file_picker: ^13.3.1
  # Shows a PDF report inside the app from memory (no file kept on disk).
  pdfx: ^2.11.0
  package_info_plus: ^10.2.2
  firebase_crashlytics: ^4.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Bloc/Cubit unit testing.
  bloc_test: ^10.0.0
  # Test doubles for repositories/data sources.
  mocktail: ^1.0.4
  # Critical user-journey tests (requires a connected device or emulator).
  integration_test:
    sdk: flutter
  # Generates the app icon (Android, iOS); settings at the end of this file.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  # Cairo (SIL OFL 1.1, see assets/fonts/OFL.txt): the family the design
  # spec names (AppTextStyles.fontFamily). Static faces, one per weight the
  # app uses, so FontWeight picks the real face instead of a synthetic one.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

# App icon, from assets/images/logo-app.jpg. assets/icon holds the two
# sources made from it: app_icon.png (iOS, older Android) and
# app_icon_foreground.png, padded to the safe zone of the Android adaptive
# icon. After changing them, run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground is already padded.
  adaptive_icon_foreground_inset: 0
