name: healthylife_ai
description: HealthyLife AI - Design & Motion System (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  device_preview: ^1.3.1
  # State management (Cubits/Blocs) — see lib/presentation/bloc.
  flutter_bloc: ^9.1.1
  # HTTP transport for ApiClient (lib/core/network). The app currently runs
  # on mock data sources; this is the ready-to-wire real transport.
  http: ^1.2.2
  # Local storage (session, settings, cached entries) behind the
  # StorageService abstraction in lib/core/storage.
  shared_preferences: ^2.3.0
  # Date/number formatting used by flutter gen-l10n and formatters.
  intl: any
  firebase_core: ^3.0.0      # أو أحدث إصدار متوافق
  firebase_messaging: ^15.0.0 # لإدارة الإشعارات (Push Notifications) المطلوبة في التطبيق
  # Opens the OS app-settings page ("Open notification settings") from the
  # notification settings screen. Notification permission itself is read and
  # requested through firebase_messaging (already configured); this package is
  # used only for `openAppSettings()`.
  permission_handler: ^12.0.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Bloc/Cubit unit testing.
  bloc_test: ^10.0.0
  # Test doubles for repositories/data sources.
  mocktail: ^1.0.4
  # Critical user-journey tests (requires a connected device or emulator).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  # Tajawal (SIL OFL 1.1, see assets/fonts/OFL.txt) — the family
  # AppTextStyles.fontFamily requests; covers Arabic and Latin. No 600 face
  # ships, so w600 styles resolve to the Bold (700) face.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
