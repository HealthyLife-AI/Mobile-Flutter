name: Flutter checks

# Runs on every pull request and on main, so a change is analysed and tested
# before review. The Flutter version is the one recorded in .metadata.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  # Decides which native builds a change needs. It runs on a cheap Linux
  # runner, so a build that is not needed never waits for a runner (the macOS
  # one in particular) and a skipped job counts as passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/flutter-checks.yml'
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/flutter-checks.yml'

  # The APK build proves the Gradle setup, the signing guard and the manifest.
  # Dart code is compiled by analyze-and-test, so a change that touches no
  # Android file or dependency skips it; main is always built.
  android-build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # CI has no android/key.properties, so a plain release build must stop
      # with the signing message instead of using the debug key.
      - name: Release build refuses to sign with the debug key
        run: |
          if flutter build apk --release > release.log 2>&1; then
            echo "A release build without key.properties succeeded."
            exit 1
          fi
          grep -q "Release signing is not set up" release.log

      # Signed with the debug key so it installs on a test phone, but built as
      # release: R8, Crashlytics on, no DevicePreview. Never for a store.
      # CRASH_TEST adds "send a test crash" to About, to check that a crash
      # reaches Crashlytics; store builds never set it.
      - name: Release build for internal testing (debug key, on request)
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: "true"
        run: flutter build apk --release --dart-define=CRASH_TEST=true

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-internal-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios-build:
    # A build without signing: it proves the Xcode project, the entitlements
    # file, the localized strings and the privacy manifest are wired right.
    # macOS minutes cost more than Linux, so it runs only when iOS files or
    # the dependencies change.
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: iOS build without signing
        run: flutter build ios --release --no-codesign

      - name: The built app carries the privacy manifest, strings and entitlement
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/ar.lproj/InfoPlist.strings"
          test -f "$APP/en.lproj/InfoPlist.strings"
          # The entitlement is applied when signing; unsigned builds keep it
          # in the project, which the Dart test checks.
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist" | grep -qx remote-notification
