name: Flutter checks

# Runs on every pull request and on main, so a change is analysed and tested
# before review. The Flutter version is the one recorded in .metadata.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # CI has no android/key.properties, so a plain release build must stop
      # with the signing message instead of using the debug key.
      - name: Release build refuses to sign with the debug key
        run: |
          if flutter build apk --release > release.log 2>&1; then
            echo "A release build without key.properties succeeded."
            exit 1
          fi
          grep -q "Release signing is not set up" release.log

      - name: Release build for internal testing (debug key, on request)
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: "true"
        run: flutter build apk --release

  ios-build:
    # A build without signing: it proves the Xcode project, the entitlements
    # file, the localized strings and the privacy manifest are wired right.
    # macOS minutes cost more than Linux, so it runs only when iOS files or
    # the dependencies change.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: ios
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/flutter-checks.yml'

      - uses: subosito/flutter-action@v2
        if: steps.ios.outputs.ios == 'true'
        with:
          channel: stable
          flutter-version: 3.41.8
          cache: true

      - name: Dependencies
        if: steps.ios.outputs.ios == 'true'
        run: flutter pub get

      - name: iOS build without signing
        if: steps.ios.outputs.ios == 'true'
        run: flutter build ios --release --no-codesign

      - name: The built app carries the privacy manifest, strings and entitlement
        if: steps.ios.outputs.ios == 'true'
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/ar.lproj/InfoPlist.strings"
          test -f "$APP/en.lproj/InfoPlist.strings"
          # The entitlement is applied when signing; unsigned builds keep it
          # in the project, which the Dart test checks.
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist" | grep -qx remote-notification
