# Sized for a 12 GB machine. The old -Xmx8G/-XX:MaxMetaspaceSize=4G left no
# room for a second JVM, so the Kotlin compile daemon failed to start
# ("Could not connect to Kotlin compile daemon") and the build crawled.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle daemon instead of spawning another JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
